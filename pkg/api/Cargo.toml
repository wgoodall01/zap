[package]
name = "api"
version = "0.1.0"
edition = "2024"
default-run = "dev_server"

# 'lambda' build profile, optimized for AWS Lambda deployment
[profile.lambda]
inherits = "release"
opt-level = "z"   # Optimize for size
lto = "fat"       # Enable Link Time Optimization
codegen-units = 1 # Better optimizations with a single codegen unit
panic = "abort"   # Reduce binary size by aborting on panic
strip = true      # Strip symbols to reduce size
debug = false     # No debug info for smaller binary


[dependencies]
rocket = { version = "0.5.1", features = ["serde_json"] }
rocket_okapi = { version = "0.9.0", features = ["swagger", "uuid"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
schemars = {version ="*", features=["uuid1", "chrono"]}
init-data-rs = "0.1.3"
dotenvy = "0.15.7"
anyhow = { version = "1.0.99", features = ["backtrace"] }
serde_json = "1.0.142"
serde_with = "3.0"
aws-sdk-secretsmanager = "1.0"
aws-config = "1.0"
lambda-web = { version = "0.2.1", features = ["rocket05"] }
lambda_runtime = "0.14.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4.41", features = ["serde", "std"] }
uuid = { version = "1.18.0", features = ["serde", "std", "v7"] }
futures = "0.3.31"
async-stream = "0.3"

[package]
name = "api"
version = "0.1.0"
edition = "2024"
default-run = "dev_server"

# 'lambda' build profile, optimized for AWS Lambda deployment
[profile.lambda]
inherits = "release"
opt-level = "z"   # Optimize for size
lto = "fat"       # Enable Link Time Optimization
codegen-units = 1 # Better optimizations with a single codegen unit
panic = "abort"   # Reduce binary size by aborting on panic
strip = true      # Strip symbols to reduce size
debug = false     # No debug info for smaller binary


[dependencies]
anyhow = { version = "1.0.99", features = ["backtrace"] }
async-stream = "0.3"
base64 = "0.22"
aws-config = "1.0"
aws-sdk-secretsmanager = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4.41", features = ["serde", "std"] }
chrono-tz = "0.10"
derive_more = { version = "1.0", features = ["deref", "display"] }
dotenvy = "0.15.7"
futures = "0.3.31"
hex = "0.4"
hmac = "0.12"
init-data-rs = "0.1.3"
lambda_http = "0.14"
lambda_runtime = "0.14.3"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
scraper = "0.20"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_with = "3.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "bigdecimal"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.0"
utoipa = { version = "5.3", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }
uuid = { version = "1.18.0", features = ["serde", "std", "v7"] }

[dev-dependencies]
tokio-test = "0.4"

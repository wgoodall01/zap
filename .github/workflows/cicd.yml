name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load tool versions
        id: tool-versions
        run: |
          BUN_VERSION=$(grep '^bun' .tool-versions | awk '{print $2}')
          echo "bun_version=${BUN_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pkg/api -> target"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tool-versions.outputs.bun_version }}
      - name: Install dependencies
        run: bun install

      - name: Build Cargo tests
        run: "cd pkg/api && cargo test --no-run"
      - name: Run Cargo tests
        run: "cd pkg/api && cargo test --no-fail-fast"
      - name: Run Clippy
        run: "cd pkg/api && cargo clippy -- -D warnings"
      - name: Build and test web
        run: "cd pkg/web && bun run build && bun run test"
      - name: Build infra
        run: "cd pkg/infra && bun run build"

  build:
    runs-on: ubuntu-latest

    # Required for OIDC authentication with AWS (to fetch secrets for web build)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load tool versions
        id: tool-versions
        run: |
          BUN_VERSION=$(grep '^bun' .tool-versions | awk '{print $2}')
          echo "bun_version=${BUN_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pkg/api -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-lambda
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tool-versions.outputs.bun_version }}
      - name: Install Zig toolchain (for Lambda cross-compilation)
        uses: mlugg/setup-zig@v2

      - name: Install dependencies
        run: bun install

      - name: Build API
        run: cd pkg/api && cargo build
      - name: Generate OpenAPI spec
        run: cd pkg/api && ./scripts/generate_openapi_spec.sh

      - name: Build Lambda
        run: cd pkg/api && ./scripts/build_lambda.sh

      - name: Load AWS account configuration
        id: aws-config
        run: |
          ACCOUNT_ID=$(jq -r '.prod.accountId' pkg/infra/account_ids.json)
          REGION=$(jq -r '.prod.region' pkg/infra/account_ids.json)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/GithubActionsDeployRole"
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "region=${REGION}" >> $GITHUB_OUTPUT
          echo "role_arn=${ROLE_ARN}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-config.outputs.role_arn }}
          aws-region: ${{ steps.aws-config.outputs.region }}
          role-session-name: GitHubActions-Build-${{ github.run_id }}

      - name: Fetch env from AWS Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id api_keys --query SecretString --output text)
          echo "$SECRET_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Generate web API client
        run: cd pkg/web && bun run gen
      - name: Build web
        run: cd pkg/web && bun run build

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bootstrap
          path: pkg/api/target/lambda/lambda_server/bootstrap

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pkg/web/dist/

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest

    # Required for OIDC authentication with AWS
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    ################################################################################
    ##                                                                            ##
    ##  WARNING                                                                   ##
    ##                                                                            ##
    ##  The `deploy` job uses `id-token: write`, which allows it to retrieve      ##
    ##  temporary Administrator credentials in AWS.                               ##
    ##                                                                            ##
    ##  DO NOT run any third-party Actions without hash-pinning their version.    ##
    ##                                                                            ##
    ################################################################################

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load tool versions
        id: tool-versions
        run: |
          BUN_VERSION=$(grep '^bun' .tool-versions | awk '{print $2}')
          echo "bun_version=${BUN_VERSION}" >> $GITHUB_OUTPUT

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-bootstrap
          path: pkg/api/target/lambda/lambda_server/

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: pkg/web/dist/

      - name: Make Lambda bootstrap executable
        run: chmod +x pkg/api/target/lambda/lambda_server/bootstrap

      - name: Load AWS account configuration
        id: aws-config
        run: |
          ACCOUNT_ID=$(jq -r '.prod.accountId' pkg/infra/account_ids.json)
          REGION=$(jq -r '.prod.region' pkg/infra/account_ids.json)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/GithubActionsDeployRole"
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "region=${REGION}" >> $GITHUB_OUTPUT
          echo "role_arn=${ROLE_ARN}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-config.outputs.role_arn }}
          aws-region: ${{ steps.aws-config.outputs.region }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tool-versions.outputs.bun_version }}

      - name: Install dependencies
        run: bun install

      # TODO: Database connectivity from GH Actions???
      # - name: Deploy database migrations
      #   run: cd pkg/api && ./scripts/deploy_migrations.sh

      - name: Deploy infrastructure
        run: cd pkg/infra && bun run cdk deploy --all --require-approval never
